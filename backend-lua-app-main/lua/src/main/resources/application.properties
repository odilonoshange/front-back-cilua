spring.application.name=lua
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/luandaaudiovisual
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Pasta onde os ficheiros de upload (imagens/vídeos) são gravados.
app.upload.dir=uploads

# Por defeito o Spring limita uploads a 1MB, o que bloquearia qualquer
# vídeo real. Estes limites permitem ficheiros até 500MB.
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
